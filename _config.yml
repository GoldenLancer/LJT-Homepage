locale: "en-US"
site_theme: "default"
title: "Junteng Liu"
title_separator: "-"
name: "Junteng Liu"
description: "First-year PhD candidate at HKUST NLP Group, researching natural language processing and machine learning."
url: "https://goldenlancer.github.io"
baseurl: "/LJT-Homepage"
repository: "GoldenLancer/LJT-Homepage"

author:
  name: "Junteng Liu"
  bio: "First-year PhD candidate. Natural language processing and machine learning."
  affiliation: "HKUST NLP Group"
  institution: "Hong Kong University of Science and Technology"
  email: "jliugi@connect.ust.hk"
  github: "Vicent0205"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  twitter: "junteng88716710"

# No photo, location, additional profiles, or analytics are supplied.
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
talkmap_link: false
comments:
  provider: false
atom_feed:
  hide: true
analytics:
  provider: "false"
twitter:
  username: "junteng88716710"
social:
  type: "Person"
  name: "Junteng Liu"
  links:
    - "https://github.com/Vicent0205"
    - "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - "https://x.com/junteng88716710"

include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - "*.ipynb"
  - .asset-cache
  - .bundle
  - .devcontainer
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - AGENTS.md
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - "package.json*"
  - package-lock.json
  - Rakefile
  - README.md
  - docker-compose.yaml
  - tmp
  - vendor
  - scripts
  - files
  - markdown_generator
  - talkmap
  - talkmap.py
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - _drafts
  - _posts
  - _publications
  - _talks
  - _teaching
  - _portfolio
  - _pages/404.md
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/cv.md
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/sitemap.md
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/talks.html
  - _pages/teaching.html
  - _pages/terms.md
  - _pages/year-archive.html

# Do not publish the template's demonstration collections or other pages.
collections: {}
defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      published: false
      comments: false
      share: false

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Etc/UTC
plugins:
  - jekyll-sitemap
whitelist:
  - jekyll-sitemap
compress_html:
  clippings: all
  ignore:
    envs: development
