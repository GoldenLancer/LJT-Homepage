name: Deploy Jekyll site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["gh-pages"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-gh-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0

      - name: Install UglifyJS
        run: npm install -g uglify-js

      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js

      - name: Set Pages build type to GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -i -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}' || true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: false

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Verify generated homepage
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/publications/index.html
          for text in \
            "Junteng Liu" \
            "First-year Ph.D. candidate" \
            "HKUST NLP Group" \
            "Shanghai Jiao Tong University" \
            "MINIMAX" \
            "Tencent WXG" \
            "Shanghai AI Lab" \
            "Zhiyuan Honor Scholarship" \
            "jliugi@connect.ust.hk" \
            "Vicent0205" \
            "tbK9jl4AAAAJ" \
            "junteng88716710" \
            "SynLogic: Synthesizing" \
            "Perception Bottleneck of VLMs" \
            "Universal Truthfulness Hyperplane" \
            "In-Context Sharpness as Alerts" \
            "C-Eval: A Multi-Level Multi-Discipline" \
            "Composing Parameter-Efficient Modules"; do
            grep -Fiq "$text" _site/index.html
          done
          for text in \
            "SynLogic: Synthesizing" \
            "Perception Bottleneck of VLMs" \
            "Universal Truthfulness Hyperplane" \
            "In-Context Sharpness as Alerts" \
            "C-Eval: A Multi-Level Multi-Discipline" \
            "Composing Parameter-Efficient Modules" \
            "EMNLP 2024" "ICML 2024" "NeurIPS 2023"; do
            grep -Fiq "$text" _site/publications/index.html
          done
          if grep -R -Ei "Paper Title Number|GitHub Journal of Bugs|Academic Pages is a ready|Red Brick University|none@example.org|Skill 1" _site/index.html _site/publications; then
            echo "Template placeholder content found in generated site" >&2
            exit 1
          fi
          echo "Homepage and publications verification passed."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
      contents: read
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
