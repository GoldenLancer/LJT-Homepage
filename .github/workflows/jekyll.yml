name: Build and deploy Junteng Liu's homepage

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Minify theme JavaScript
        run: |
          npm install -g uglify-js
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter --trace
        env:
          JEKYLL_ENV: production
      - name: Verify homepage, publications, and page count
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'cgi'

          publications = YAML.safe_load(File.read('_data/publications.yml'))
          abort 'Expected exactly six publications from memory' unless publications.length == 6

          expected_pages = %w[_site/index.html _site/publications/index.html].sort
          actual_pages = Dir.glob('_site/**/*.html').sort
          abort "Unexpected content pages: #{actual_pages.inspect}" unless actual_pages == expected_pages

          expected_pages.each do |path|
            html = File.read(path)
            text = CGI.unescapeHTML(html.gsub(/<[^>]*>/, ' ')).gsub(/\s+/, ' ')
            abort "Expected six publication entries in #{path}" unless html.scan('class="publication-item"').length == 6
            publications.each do |publication|
              abort "Missing publication #{publication.fetch('title')} in #{path}" unless text.include?(publication.fetch('title'))
              publication.fetch('authors').each do |author|
                abort "Missing author #{author} in #{path}" unless text.include?(author)
              end
            end
            abort "Template placeholder found in #{path}" if html.match?(/Your Name|Your Sidebar Name|none@example\.org|Red Brick University|Paper Title Number|yourorcidurl|PS_CX0AAAAAJ/)
          end

          homepage = CGI.unescapeHTML(File.read('_site/index.html'))
          %w[about academic-background research-experience skills publications honors contact].each do |section|
            abort "Missing homepage section #{section}" unless homepage.include?("id=\"#{section}\"")
          end
          ['mailto:jliugi@connect.ust.hk', 'https://github.com/Vicent0205', 'https://x.com/junteng88716710', 'https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate'].each do |contact|
            abort "Missing contact link #{contact}" unless homepage.include?(contact)
          end
          abort 'Incorrect project-site base path' unless homepage.include?('https://goldenlancer.github.io/LJT-Homepage/')
          abort 'Stock profile image still present' if homepage.include?('/images/profile.png') || homepage.include?('/images/og-image.png')
          abort 'Missing generated stylesheet' unless File.file?('_site/assets/css/main.css')
          puts 'Verified: only About and Publications pages; all six publications appear on both; memory contact links and homepage sections are present.'
          RUBY
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
